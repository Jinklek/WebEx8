<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Обратная связь — Задание 8</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<button id="openBtn" type="button">Открыть форму</button>

<div id="modal" class="modal" hidden>
    <div class="modal__box">
        <button id="closeBtn" type="button" class="close">×</button>
        <h2>Обратная связь</h2>
        <form id="fbForm">
            <input id="fio" name="fio" type="text" placeholder="ФИО" required>
            <input id="email" name="email" type="email" placeholder="Email" required>
            <input id="phone" name="phone" type="tel" placeholder="Телефон" required>
            <input id="org" name="org" type="text" placeholder="Организация">
            <textarea id="msg" name="message" rows="3" placeholder="Сообщение" required></textarea>
            <label class="agree">
                <input id="agree" name="agree" type="checkbox" required>
                <span>Согласен на обработку персональных данных</span>
            </label>
            <button type="submit">Отправить</button>
        </form>
        <p id="status"></p>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
